<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Promise Example</title>
  </head>
  <body>
    <h1>Fetch and Display Data with Promises</h1>
    <button id="fetchButton">Fetch Data</button>
    <div id="output">
      <!-- Data will be displayed here -->
    </div>

    <script>
      // Simulate an asynchronous data fetch
      function fetchData() {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            const success = true; // Simulate success or failure
            if (success) {
              const data = {
                name: "John Doe",
                age: 30,
                city: "New York",
              };
              resolve(data); // Resolve the promise with the data
            } else {
              reject("Failed to fetch data."); // Reject the promise with an error message
            }
          }, 2000); // Simulate a 2-second delay
        });
      }

      // Function to display the fetched data
      function displayData(data) {
        const outputDiv = document.getElementById("output");
        if (outputDiv) {
          outputDiv.innerHTML = `
      <h2>User Information:</h2>
      <p><strong>Name:</strong> ${data.name}</p>
      <p><strong>Age:</strong> ${data.age}</p>
      <p><strong>City:</strong> ${data.city}</p>
    `;
        } else {
          console.error("Output div not found.");
        }
      }

      // Function to display an error message
      function displayError(error) {
        const outputDiv = document.getElementById("output");
        if (outputDiv) {
          outputDiv.innerHTML = `<p style="color: red;">Error: ${error}</p>`;
        } else {
          console.error("Output div not found.");
        }
      }

      // Usage of the Promise
      document.addEventListener("DOMContentLoaded", () => {
        const fetchButton = document.getElementById("fetchButton");
        if (fetchButton) {
          fetchButton.addEventListener("click", () => {
            const outputDiv = document.getElementById("output");
            if (outputDiv) {
              outputDiv.innerHTML = "<p>Fetching data...</p>"; // Show loading message
            }

            fetchData()
              .then((data) => {
                displayData(data); // Call displayData on successful resolution
              })
              .catch((error) => {
                displayError(error); // Call displayError on rejection
              });
          });
        } else {
          console.error("Fetch button not found.");
        }
      });
    </script>
  </body>
</html>
